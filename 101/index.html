<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d3b2e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="101 Okey">
  <title>101 Okey</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>101 Okey</h1>
    <div id="okeyInfo"></div>
    <button id="btnNew" class="iconBtn" title="Yeni Oyun">↺</button>
  </header>

  <section id="opponents"></section>

  <section id="table">
    <div id="tableMelds"></div>
  </section>

  <section id="center">
    <div class="centerItem" id="deckWrap">
      <div class="tile back" id="deck"><span class="num" id="deckCount"></span></div>
      <label>Deste</label>
    </div>
    <div class="centerItem">
      <div id="indicatorWrap"></div>
      <label>Gösterge</label>
    </div>
    <div class="centerItem" id="prevDiscardWrap">
      <div id="prevDiscard"></div>
      <label>Yerden Al</label>
    </div>
  </section>

  <div id="status"></div>

  <section id="stagedWrap">
    <div class="stagedHead">
      <span>Hazırlanan perler: <b id="stagedPoints">0</b> puan</span>
      <button id="btnUnstage" class="miniBtn">Geri Al</button>
    </div>
    <div id="staged"></div>
  </section>

  <section id="rack"></section>

  <nav id="actions">
    <button id="btnMeld">Per Yap</button>
    <button id="btnOpen">Aç (101)</button>
    <button id="btnDiscard">Taş At</button>
    <button id="btnSort" class="ghost">Sırala</button>
  </nav>

  <div id="modal" class="hidden">
    <div class="modalCard">
      <div id="modalMsg"></div>
      <button id="btnRestart">Yeni Oyun</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
